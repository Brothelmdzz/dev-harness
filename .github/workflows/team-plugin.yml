name: Team plugin
on:
  push:
    branches: [codex/team-plugin-release]
    tags: ['v5.*']
  pull_request:
    paths:
      - 'plugins/dev-harness/**'
      - 'scripts/team_plugin.py'
      - 'tests/team_harness/**'
      - '.agents/plugins/marketplace.json'
      - '.github/workflows/team-plugin.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests/team_harness -v
      - run: python scripts/team_plugin.py check plugins/dev-harness
      - run: python scripts/team_plugin.py package --output dist/dev-harness
      - run: python scripts/team_plugin.py package --format skills --output dist/repository-skills
