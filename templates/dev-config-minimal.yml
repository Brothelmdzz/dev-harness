# 最小化配置模板
# 只需要填写项目名和门禁命令

project: my-project

gates:
  build: "echo 'ERROR: 未配置构建命令' && exit 1"
  test: "echo 'ERROR: 未配置测试命令' && exit 1"

# Plan 阶段等待策略（可选，v3.4.2+）— 默认 wait
# plan:
#   fallback: wait         # wait | auto-approve | skip
#                          # wait: plan 写完停下等用户说"通过"（默认，严肃任务推荐）
#                          # auto-approve: 不等审批直接 implement（yolo 模式，适合微小变更）
#                          # skip: 跳过 plan 阶段（仅 D 路线/修 typo 等极简任务）

# 跨厂商对抗审查（可选）— 装了 codex cli 时自动启用第 4 路审查
# review:
#   cross_vendor:
#     enabled: auto    # auto | true | false（默认 auto）
#                      # auto: 检测到 codex cli 自动启用，没装则静默跳过
#                      # true: 强制启用（未装 codex 会报错）
#                      # false: 永不启用
#     provider: codex  # v4 起仅支持 codex（依赖 ~/.codex/config.toml 中预设的 model_provider）

# 防线参数（可选，不配则使用默认值）
# limits:
#   stage_timeout: 1800        # 单阶段超时，秒 (默认30min，范围5min~2h)
#   max_duration: 7200         # 总运行时长，秒 (默认2h，范围10min~8h)
#   window_minutes: 5          # 滑动窗口，分钟 (默认5，范围2~30)
#   max_events: 10             # 窗口内最大续跑次数 (默认10，范围3~50)
#   rate_limit_pause_min: 15   # Rate limit 暂停，分钟 (默认15，范围5~60)
#   max_retries: 3             # 最大重试次数 (默认3，范围1~10)
#   max_auto_phases: 10        # 最大自动Phase数 (默认10，范围1~50)
