<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>订单管理（视觉稿示例）</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, "Segoe UI", sans-serif; }
    body { background: #f5f5f5; color: #333; }
    .header { background: #fff; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e8e8e8; }
    .header h1 { font-size: 20px; font-weight: 500; }
    .btn-primary { background: #1677ff; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 14px; }
    .btn-primary:hover { background: #4096ff; }
    .toolbar { background: #fff; margin: 16px 24px; padding: 16px; border-radius: 8px; display: flex; gap: 16px; align-items: center; }
    .toolbar input, .toolbar select { padding: 6px 12px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 14px; }
    .table-wrapper { background: #fff; margin: 0 24px; border-radius: 8px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    thead { background: #fafafa; }
    th { text-align: left; padding: 12px 16px; font-weight: 500; font-size: 13px; color: #666; }
    td { padding: 14px 16px; border-top: 1px solid #f0f0f0; font-size: 14px; }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
    .tag-paid { background: #f6ffed; color: #52c41a; border: 1px solid #b7eb8f; }
    .tag-pending { background: #fffbe6; color: #faad14; border: 1px solid #ffe58f; }
    .actions a { color: #1677ff; margin-right: 12px; cursor: pointer; }
    .actions a.danger { color: #ff4d4f; }
    .pagination { padding: 16px; text-align: right; }
    .pagination a { display: inline-block; padding: 4px 8px; margin: 0 2px; border: 1px solid #d9d9d9; border-radius: 4px; cursor: pointer; }
    .pagination a.active { background: #1677ff; color: #fff; border-color: #1677ff; }
  </style>
</head>
<body>
  <div class="header">
    <h1>订单管理</h1>
    <button class="btn-primary">+ 新增订单</button>
  </div>

  <div class="toolbar">
    <span>搜索：</span>
    <input type="text" placeholder="订单号 / 用户 ID" style="width: 240px">
    <span>状态：</span>
    <select>
      <option>全部</option>
      <option>已支付</option>
      <option>待支付</option>
    </select>
    <button class="btn-primary">查询</button>
  </div>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>订单号</th>
          <th>用户</th>
          <th>金额</th>
          <th>状态</th>
          <th>创建时间</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>ABC-001</td>
          <td>user-a</td>
          <td>¥199.00</td>
          <td><span class="tag tag-paid">已支付</span></td>
          <td>2026-05-08 10:23</td>
          <td class="actions">
            <a>详情</a>
            <a>编辑</a>
            <a class="danger">取消</a>
          </td>
        </tr>
        <tr>
          <td>ABC-002</td>
          <td>user-b</td>
          <td>¥58.00</td>
          <td><span class="tag tag-pending">待支付</span></td>
          <td>2026-05-08 11:05</td>
          <td class="actions">
            <a>详情</a>
            <a>编辑</a>
            <a class="danger">取消</a>
          </td>
        </tr>
      </tbody>
    </table>
    <div class="pagination">
      <a>&lt;</a>
      <a class="active">1</a>
      <a>2</a>
      <a>3</a>
      <a>&gt;</a>
    </div>
  </div>
</body>
</html>
